[project]
name = "docs-agent"
version = "0.1.0"
# Upper-bounded (not just ">=3.12"): uv resolves dependencies universally
# across the whole requires-python range, including hypothetical future
# versions (e.g. 3.14) nobody has actually run this against — and on
# those, sentence-transformers' pinned torch range has no compatible
# wheel for this platform, making every `uv add`/`uv sync` fail even
# though 3.12 itself resolves fine. Matches .python-version (3.12).
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.2",
    "mcp[cli]>=2.2.0",
    "numpy<2",
    "openai>=3.0.0",
    "pdfplumber>=0.11.0",
    "psycopg2-binary>=2.9.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
    "sentence-transformers>=3.0.0,<3.4.0",
    "striprtf>=0.0.33",
    "tenacity>=9.1.4",
]

[tool.uv]
# sentence-transformers pulls in torch transitively. Recent torch releases no
# longer publish wheels for Intel macOS (only Apple Silicon / Linux / Windows).
# This forces the resolver to pick a torch version that still supports this
# machine, instead of silently resolving to a version that can't be installed.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pyright]
include = ["."]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: tests requiring a real TEST_DATABASE_URL Postgres+pgvector instance",
]
